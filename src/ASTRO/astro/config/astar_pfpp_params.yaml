# Parametri za novu A* + Potential Field Pure Pursuit (PFPP) strukturu.
# Node-ovi: astar_global_planner.py, pfpp_local_controller.py
#
# Ovdje se drže vrijednosti za lakše podešavanje bez diranja launch
# datoteke ili koda. Objašnjenja svakog parametra su u komentarima
# uz declare_parameter() poziv u odgovarajućem .py fajlu.

astar_global_planner:
  ros__parameters:
    map_topic: /map
    goal_topic: /goal_pose
    plan_topic: /plan

    map_frame: map
    base_frame: base_footprint

    robot_radius: 0.43
    obstacle_threshold: 50

    smoothing_weight_data: 0.5
    smoothing_weight_smooth: 0.25
    smoothing_iterations: 100
    smoothing_tolerance: 0.0001

pfpp_local_controller:
  ros__parameters:
    plan_topic: /plan
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel

    map_frame: map
    base_frame: base_footprint

    # --- Pure Pursuit ---
    lookahead_distance_min: 0.35
    lookahead_distance_max: 0.80
    lookahead_speed_gain: 0.5
    goal_tolerance: 0.10
    attractive_gain: 1.1

    # --- Brzine ---
    max_linear_velocity: 0.25
    min_linear_velocity: 0.05
    max_angular_velocity: 2.1
    max_linear_acceleration: 0.6
    max_angular_acceleration: 3.2

    # --- Usporavanje ---
    slowdown_distance: 0.85
    slowdown_min_factor: 0.30
    obstacle_slowdown_min_factor: 0.35

    # --- Upravljanje kutom ---
    heading_kp: 1.2
    max_avoidance_deflection_deg: 75.0
    rotation_lock_deadband_deg: 25.0
    rotation_lock_hysteresis_deg: 10.0
    rotation_lock_omega_scale: 0.4

    # --- Potencijalno polje ---
    influence_radius: 1.5
    min_obstacle_distance: 0.2
    repulsive_gain: 1.3
    repulsive_smoothing_alpha: 0.3
    scan_stride: 2
    scan_angle_offset_deg: 180.0
    pf_front_angle_deg: 100.0

    # --- Zadržavanje strane zaobilaska ---
    side_bias_ambiguous_ratio: 0.15
    side_bias_strength: 0.35

    # --- Hard-stop failsafe ---
    hard_stop_distance: 0.24
    hard_stop_front_angle_deg: 40.0
    hard_stop_confirm_cycles: 2
    hard_stop_release_cycles: 3

    # --- TF robustnost ---
    tf_grace_period: 0.4

    control_rate: 20.0
